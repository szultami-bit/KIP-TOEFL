<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIP Certificate Admin Login</title>
<style>
:root{--navy:#071633;--blue:#2454e6;--line:#d9e1ec;--soft:#f6f8fc;--text:#17213a;--muted:#667085;--bad:#991b1b;--good:#166534}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--soft);color:var(--text)}
.top{height:78px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 24px;gap:12px}
.top img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px}
.top strong{font-size:19px}.top small{display:block;opacity:.75;margin-top:2px}
.wrap{max-width:620px;margin:52px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 30px rgba(7,22,51,.08)}
h1{margin:0 0 8px}.muted{color:var(--muted);line-height:1.55}
label{display:block;margin:16px 0 7px;font-weight:700}
.input{width:100%;padding:13px 14px;border:1px solid #cfd8e6;border-radius:11px;font:inherit}
.btn{width:100%;margin-top:18px;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:900;background:var(--blue);color:#fff;cursor:pointer}
.btn:disabled{opacity:.55}
.status{margin-top:16px;padding:12px 14px;border-radius:11px;background:#f8fafc;border:1px solid var(--line);font-size:13px}
.status.good{background:#f0fdf4;border-color:#86efac;color:var(--good)}
.status.bad{background:#fff1f2;border-color:#fecaca;color:var(--bad)}
</style>
</head>
<body>
<header class="top">
  <img src="kip-logo.jpg" alt="KIP">
  <div><strong>KIP Certificate Admin Login</strong><small>Temporary admin login for certificate QA</small></div>
</header>
<main class="wrap">
<section class="card">
  <h1>Admin Sign In</h1>
  <p class="muted">Sign in with the authorized KIP admin account. After successful login, this page will return you to the certificate test page.</p>

  <label>Email</label>
  <input id="email" class="input" type="email" autocomplete="username">

  <label>Password</label>
  <input id="password" class="input" type="password" autocomplete="current-password">

  <button id="go" class="btn">Sign In & Continue</button>
  <div id="status" class="status">Ready.</div>
</section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ADMIN_EMAIL='szultami@gmail.com';
const cfg=window.KIP_CONFIG||window.KIP_SUPABASE||{};
const url=cfg.SUPABASE_URL||cfg.url||'';
const key=cfg.SUPABASE_ANON_KEY||cfg.anonKey||'';
const $=id=>document.getElementById(id);
let sb=null;

function msg(t,k=''){
  $('status').textContent=t;
  $('status').className='status'+(k?' '+k:'');
}
async function init(){
  if(!url||!key||!window.supabase){
    msg('config.js / Supabase not ready.','bad');
    $('go').disabled=true;
    return;
  }
  sb=window.supabase.createClient(url,key);
  const {data}=await sb.auth.getSession();
  const email=(data?.session?.user?.email||'').toLowerCase();
  if(email===ADMIN_EMAIL){
    msg('Admin session already active. Redirecting…','good');
    setTimeout(()=>location.href='certificate-test-v1.0.html',500);
  }
}
$('go').onclick=async()=>{
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  if(email!==ADMIN_EMAIL){
    msg('Use the authorized KIP admin email.','bad');
    return;
  }
  if(!password){msg('Enter the admin password.','bad');return}
  $('go').disabled=true;
  msg('Signing in…');
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    if((data?.user?.email||'').toLowerCase()!==ADMIN_EMAIL){
      await sb.auth.signOut();
      throw new Error('This account is not authorized as KIP admin.');
    }
    msg('Login successful. Redirecting…','good');
    setTimeout(()=>location.href='certificate-test-v1.0.html',600);
  }catch(err){
    msg('Login failed: '+(err.message||err),'bad');
    $('go').disabled=false;
  }
};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
init();
</script>
</body>
</html>
